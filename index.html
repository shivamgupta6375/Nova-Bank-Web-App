<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nova Bank</title>
    <style>
      :root {
        --bg: #f5f8fc;
        --card: #ffffff;
        --text: #17232b;
        --muted: #6b7785;
        --border: #e6eef8;
        --shadow: 0 8px 30px rgba(15, 32, 52, 0.08);
        --primary: #1f6feb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      button,
      input,
      select {
        font: inherit;
      }

      .hidden {
        display: none !important;
      }

      .muted {
        color: var(--muted);
      }

      .auth {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #edf4ff, #f8fbff);
      }

      .auth-card {
        width: min(430px, 100%);
        background: #fff;
        padding: 34px;
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .logo {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 8px;
      }

      .logo span {
        color: var(--primary);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 34px;
      }

      .field {
        margin-top: 14px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      input,
      select {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: rgba(31, 111, 235, 0.65);
        box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.08);
      }

      .btn {
        display: inline-block;
        width: 100%;
        margin-top: 16px;
        padding: 12px 16px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
      }

      .link {
        color: var(--primary);
        cursor: pointer;
        font-weight: 600;
      }

      .error {
        margin-top: 10px;
        color: #b42318;
      }

      .success {
        margin-top: 10px;
        color: #0c8a4f;
      }

      .layout {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 285px 1fr;
      }

      .sidebar {
        background: linear-gradient(180deg, #061a38, #03142d);
        color: #fff;
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 10px;
      }

      .brand-name {
        font-weight: 800;
        font-size: 20px;
      }

      .brand-name span {
        color: var(--primary);
      }

      .brand-tag {
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
      }

      .side-nav {
        margin-top: 18px;
      }

      .nav-item {
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        color: #fff;
        border-radius: 8px;
        padding: 10px 12px;
        cursor: pointer;
        margin-bottom: 8px;
      }

      .nav-item.active {
        background: rgba(255, 255, 255, 0.08);
      }

      .secure-art {
        margin-top: 24px;
        display: grid;
        place-items: center;
        position: relative;
        width: 100%;
        height: 110px;
      }

      .secure-bank {
        font-size: 54px;
        opacity: 0.75;
      }

      .secure-shield {
        position: absolute;
        bottom: 18px;
        right: 38%;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #4fd1a5;
        display: grid;
        place-items: center;
        font-size: 18px;
      }

      .secure-title {
        text-align: center;
        font-weight: 700;
        margin-top: 14px;
      }

      .secure-sub {
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        margin-top: 4px;
      }

      .logout {
        margin-top: auto;
        background: rgba(255, 255, 255, 0.06);
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        color: #fff;
        cursor: pointer;
      }

      .main {
        padding: 30px 38px;
        max-width: 1500px;
        width: 100%;
        margin: auto;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
      }

      .topbar h1 {
        margin: 0 0 5px;
        font-size: 30px;
      }

      .top-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .bell {
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 12px;
        width: 42px;
        height: 42px;
        cursor: pointer;
      }

      .top-divider {
        width: 1px;
        height: 24px;
        background: var(--border);
      }

      .profile {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .avatar {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #edf3ff;
        color: var(--primary);
        font-weight: 800;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px;
        box-shadow: var(--shadow);
      }

      .card-label {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 10px;
      }

      .amount {
        font-size: 30px;
        font-weight: 800;
        margin-bottom: 8px;
      }

      .balance-foot,
      .subvalue {
        color: var(--muted);
        font-size: 13px;
      }

      .info-card {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .big-value {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 6px;
      }

      .quick-card {
        margin-top: 22px;
      }

      .section-head {
        margin-bottom: 18px;
      }

      .section-title {
        font-size: 20px;
        font-weight: 800;
      }

      .action-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .action {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: linear-gradient(180deg, #fff, #fbfdff);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: left;
        cursor: pointer;
      }

      .action-icon {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        font-weight: 700;
        background: #eff5ff;
        color: var(--primary);
      }

      .action strong {
        font-size: 16px;
      }

      .action span {
        color: var(--muted);
        font-size: 12px;
      }

      .summary-card {
        margin-top: 22px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 12px;
      }

      .summary-grid small {
        display: block;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .summary-grid b {
        font-size: 16px;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(7, 20, 38, 0.64);
        display: grid;
        place-items: center;
        z-index: 20;
        padding: 20px;
      }

      .modal-card {
        width: min(440px, 100%);
        background: #fff;
        border-radius: 20px;
        padding: 26px;
        box-shadow: var(--shadow);
      }

      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .close {
        border: none;
        background: transparent;
        font-size: 22px;
        cursor: pointer;
      }

      .details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .detail {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .detail small {
        display: block;
        color: var(--muted);
        margin-bottom: 4px;
      }

      footer {
        margin-top: 26px;
        color: var(--muted);
        text-align: center;
        font-size: 13px;
      }

      @media (max-width: 1050px) {
        .layout {
          grid-template-columns: 220px 1fr;
        }

        .action-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .summary-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 760px) {
        .layout {
          display: block;
        }

        .sidebar {
          min-height: auto;
          padding: 18px;
        }

        .main {
          padding: 20px 18px;
        }

        .cards,
        .action-grid,
        .summary-grid,
        .details {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <script>
      const demoUsers = [
        {
          accNo: "6371234122",
          username: "adam",
          password: "12345",
          mobileNo: "9999999999",
          address: "Noida, Uttar Pradesh",
          accType: "Saving",
          balance: 500,
        },
        {
          accNo: "6371234123",
          username: "john",
          password: "678910",
          mobileNo: "8888888888",
          address: "Delhi, India",
          accType: "Current",
          balance: 1000,
        },
      ];

      let users = JSON.parse(localStorage.getItem("novaUsers") || "null") || demoUsers;
      let current = JSON.parse(sessionStorage.getItem("novaCurrent") || "null");

      const app = document.querySelector("#app");

      function save() {
        localStorage.setItem("novaUsers", JSON.stringify(users));
        sessionStorage.setItem("novaCurrent", JSON.stringify(current));
      }

      function money(n) {
        return "₹" + Number(n).toFixed(2);
      }

      function initials() {
        return current.username.slice(0, 2).toUpperCase();
      }

      function render() {
        if (!current) {
          renderAuth("login");
          return;
        }
        renderDashboard();
      }

      function renderAuth(mode) {
        app.innerHTML = `
          <div class="auth">
            <div class="auth-card">
              <div class="logo">Nova<span>Bank</span></div>
              <h1>${mode === "login" ? "Welcome back" : "Create your account"}</h1>
              <p class="muted">${
                mode === "login"
                  ? "Login to access your banking dashboard."
                  : "Open your Nova Bank account in a few simple steps."
              }</p>

              <form id="authForm">
                <div class="field">
                  <label>Username</label>
                  <input id="username" required />
                </div>

                <div class="field">
                  <label>Password</label>
                  <input id="password" type="password" required />
                </div>

                ${
                  mode === "register"
                    ? `
                        <div class="field">
                          <label>Mobile Number</label>
                          <input id="mobile" maxlength="10" required />
                        </div>
                        <div class="field">
                          <label>Address</label>
                          <input id="address" required />
                        </div>
                        <div class="field">
                          <label>Account Type</label>
                          <select id="type">
                            <option>Saving</option>
                            <option>Current</option>
                          </select>
                        </div>
                      `
                    : ""
                }

                <button class="btn btn-primary">
                  ${mode === "login" ? "Login" : "Create Account"}
                </button>

                <div id="msg"></div>
              </form>

              <p class="muted">
                ${mode === "login" ? "Don't have an account?" : "Already have an account?"}
                <span class="link" id="switch">${mode === "login" ? " Register" : " Login"}</span>
              </p>
            </div>
          </div>
        `;

        document.querySelector("#switch").onclick = () =>
          renderAuth(mode === "login" ? "register" : "login");

        document.querySelector("#authForm").onsubmit = (e) => {
          e.preventDefault();

          const u = document.querySelector("#username").value.trim();
          const p = document.querySelector("#password").value;
          const msg = document.querySelector("#msg");

          if (mode === "login") {
            const found = users.find((x) => x.username === u && x.password === p);
            if (!found) {
              msg.className = "error";
              msg.textContent = "Invalid username or password.";
              return;
            }

            current = { ...found };
            save();
            render();
            return;
          }

          if (users.some((x) => x.username === u)) {
            msg.className = "error";
            msg.textContent = "Username already exists.";
            return;
          }

          const acc = String(Math.floor(100000000000 + Math.random() * 900000000000));
          const nu = {
            accNo: acc,
            username: u,
            password: p,
            mobileNo: document.querySelector("#mobile").value,
            address: document.querySelector("#address").value,
            accType: document.querySelector("#type").value,
            balance: 500,
          };

          users.push(nu);
          save();
          msg.className = "success";
          msg.textContent = `Account created. Account No: ${acc}`;
          setTimeout(() => renderAuth("login"), 1200);
        };
      }

      function renderDashboard() {
        app.innerHTML = `
          <div class="layout">
            <aside class="sidebar">
              <div class="brand">
                <div class="brand-mark">
                  <svg viewBox="0 0 48 48" aria-hidden="true" width="28" height="28">
                    <path d="M6 20 24 7l18 13v4H6z" fill="currentColor" />
                    <path d="M10 25h28v4H10zM13 30h5v10h-5zM21.5 30h5v10h-5zM30 30h5v10h-5z" fill="currentColor" />
                  </svg>
                </div>
                <div>
                  <div class="brand-name">Nova<span>Bank</span></div>
                  <div class="brand-tag">Your Trusted Banking Partner</div>
                </div>
              </div>

              <nav class="side-nav">
                <button class="nav-item active" onclick="dashboard()">
                  <span class="nav-icon">▦</span> Dashboard
                </button>
              </nav>

              <div class="secure-art">
                <div class="secure-bank">⌂</div>
                <div class="secure-shield">✓</div>
              </div>

              <div class="secure-title">Secure Banking</div>
              <div class="secure-sub">Your security is our priority</div>

              <button class="logout" onclick="logout()">
                <span>↪</span> Logout
              </button>
            </aside>

            <main class="main">
              <header class="topbar">
                <div>
                  <h1>Dashboard</h1>
                  <div class="muted">Welcome back, ${current.username}! 👋</div>
                </div>

                <div class="top-right">
                  <button class="bell" aria-label="Notifications">♧</button>
                  <div class="top-divider"></div>
                  <div class="profile">
                    <div class="avatar">${initials()}</div>
                    <div>
                      <b>${current.username}</b>
                    </div>
                  </div>
                </div>
              </header>

              <section class="cards">
                <div class="card balance-card">
                  <div class="card-label">Available Balance</div>
                  <div class="amount">${money(current.balance)}</div>
                  <div class="balance-foot">Account •••• ${current.accNo.slice(-4)}</div>
                </div>

                <div class="card info-card">
                  <div class="card-label">Account Number</div>
                  <div class="big-value">${current.accNo}</div>
                  <div class="subvalue">${current.accType} Account</div>
                </div>

                <div class="card info-card">
                  <div class="card-label">Mobile Number</div>
                  <div class="big-value">${current.mobileNo}</div>
                  <div class="subvalue">Registered number</div>
                </div>
              </section>

              <section class="card quick-card">
                <div class="section-head">
                  <div class="section-title">Quick Actions</div>
                  <div class="muted">Perform your banking operations easily</div>
                </div>

                <div class="action-grid">
                  <button class="action" onclick="openTransaction('deposit')">
                    <div class="action-icon">↓</div>
                    <strong>Deposit Money</strong>
                    <span>Add money to your account</span>
                  </button>

                  <button class="action" onclick="openTransaction('withdraw')">
                    <div class="action-icon">↑</div>
                    <strong>Withdraw Money</strong>
                    <span>Withdraw from your balance</span>
                  </button>

                  <button class="action" onclick="account()">
                    <div class="action-icon">♙</div>
                    <strong>Account Details</strong>
                    <span>View your account information</span>
                  </button>

                  <button class="action" onclick="changePassword()">
                    <div class="action-icon">▣</div>
                    <strong>Change Password</strong>
                    <span>Update your login password</span>
                  </button>
                </div>
              </section>

              <section class="card summary-card">
                <div class="section-title">▤ &nbsp;Account Summary</div>
                <div class="summary-grid">
                  <div>
                    <small>Username</small>
                    <b>${current.username}</b>
                  </div>
                  <div>
                    <small>Account Type</small>
                    <b>${current.accType} Account</b>
                  </div>
                  <div>
                    <small>Mobile Number</small>
                    <b>${current.mobileNo}</b>
                  </div>
                  <div style="grid-column: 1 / -1;">
                    <small>Address</small>
                    <b>${current.address}</b>
                  </div>
                </div>
              </section>

              <footer>© 2026 Nova Bank. All rights reserved. • 🛡 Secure & Trusted Banking</footer>
            </main>
          </div>
        `;
      }

      function dashboard() {
        renderDashboard();
      }

      function modal(title, body) {
        const el = document.createElement("div");
        el.className = "modal";
        el.innerHTML = `
          <div class="modal-card">
            <div class="modal-head">
              <h2>${title}</h2>
              <button class="close">✕</button>
            </div>
            ${body}
          </div>
        `;

        el.querySelector(".close").onclick = () => el.remove();
        document.body.appendChild(el);
        return el;
      }

      function openTransaction(kind) {
        const title = kind === "deposit" ? "Deposit Money" : "Withdraw Money";
        const el = modal(
          title,
          `
            <p class="muted">Current balance: ${money(current.balance)}</p>
            <form id="tx">
              <div class="field">
                <label>Amount</label>
                <input id="amt" type="number" min="1" step="0.01" required />
              </div>
              <button class="btn btn-primary">${kind === "deposit" ? "Deposit" : "Withdraw"}</button>
              <div id="txmsg"></div>
            </form>
          `
        );

        el.querySelector("#tx").onsubmit = (e) => {
          e.preventDefault();
          const txmsg = el.querySelector("#txmsg");
          const a = Number(document.querySelector("#amt").value);

          if (a <= 0 || (kind === "withdraw" && a > current.balance)) {
            txmsg.className = "error";
            txmsg.textContent = "Invalid amount or insufficient balance.";
            return;
          }

          current.balance += kind === "deposit" ? a : -a;
          users = users.map((u) =>
            u.username === current.username ? { ...u, balance: current.balance } : u
          );
          save();
          el.remove();
          renderDashboard();
        };
      }

      function account() {
        modal(
          "Account Details",
          `
            <div class="details">
              <div class="detail">
                <small>Account Number</small>
                <b>${current.accNo}</b>
              </div>
              <div class="detail">
                <small>Username</small>
                <b>${current.username}</b>
              </div>
              <div class="detail">
                <small>Mobile Number</small>
                <b>${current.mobileNo}</b>
              </div>
              <div class="detail">
                <small>Account Type</small>
                <b>${current.accType}</b>
              </div>
              <div class="detail" style="grid-column: 1 / -1;">
                <small>Address</small>
                <b>${current.address}</b>
              </div>
              <div class="detail" style="grid-column: 1 / -1;">
                <small>Balance</small>
                <b>${money(current.balance)}</b>
              </div>
            </div>
          `
        );
      }

      function changePassword() {
        const el = modal(
          "Change Password",
          `
            <form id="pw">
              <div class="field">
                <label>Old Password</label>
                <input id="old" type="password" required />
              </div>
              <div class="field">
                <label>New Password</label>
                <input id="neu" type="password" required />
              </div>
              <button class="btn btn-primary">Change Password</button>
              <div id="pmsg"></div>
            </form>
          `
        );

        el.querySelector("#pw").onsubmit = (e) => {
          e.preventDefault();

          const pmsg = el.querySelector("#pmsg");
          const oldVal = document.querySelector("#old").value;
          const neu = document.querySelector("#neu").value;

          if (oldVal !== current.password) {
            pmsg.className = "error";
            pmsg.textContent = "Invalid old password.";
            return;
          }

          current.password = neu;
          users = users.map((u) =>
            u.username === current.username ? { ...u, password: current.password } : u
          );
          save();
          el.remove();
          renderDashboard();
        };
      }

      function logout() {
        current = null;
        sessionStorage.removeItem("novaCurrent");
        renderAuth("login");
      }

      render();
    </script>
  </body>
</html>
